const holdChr = () => isChr('restock') || isChr('arson');   // 10/17: 거울은 꾹 누르기 대신 벽 통과
const holdNeed = () => HOLD_MS;
function holdStart(){ if (!holdChr() || dead || halted() || switching || hold) return; hold={t:performance.now(), el:null}; }
function holdCancel(){ if (!hold) return; if (hold.el) hold.el.remove(); hold=null; }
function holdTick(now){
  if (!hold) return;
  if (dead || halted() || switching){ holdCancel(); return; }
  const e=now-hold.t;
  if (e>=HOLD_SHOW && !hold.el) hold.el=onCell('hold',player.r,player.c,1.75);
  if (hold.el){ hold.el.style.setProperty('--h', Math.min(1,(e-HOLD_SHOW)/(holdNeed()-HOLD_SHOW))); }
  if (e>=holdNeed()){ holdCancel(); swallowTap=true; begin(); holdAct(); }
}
function holdAct(){
  if (isChr('restock')) restock(); else if (isChr('arson')) arsonAction(); else switchWorld();
}
function switchWorld(){
  if (switching || !blocks || dead) return;
  switching=true;
  const to=!mirror, OUT=reduceMotion?0:220, IN=reduceMotion?0:300, gid=gameId;
  R.mSw++; achSet('mirror_2',R.mSw);

    cards.forEach(el=>el.animate([{rotate:'y 0deg'},{rotate:'y 90deg'}],{duration:OUT,easing:'ease-in',fill:'forwards'}));
  }
  setTimeout(()=>{
    if (gid!==gameId){ switching=false; return; }
    const n=cfg.n;

    for (const pl of players) pl.r=n-1-pl.r;

    for (let i=0;i<slots.length;i++) repaintCard(i,false);
    board.getAnimations().forEach(a=>a.cancel());
    cardEls.concat(chrEl).filter(Boolean).forEach(el=>el.getAnimations().forEach(a=>{ if (a.effect && a.effect.getKeyframes().some(k=>k.rotate)) a.cancel(); }));
    if (!reduceMotion){
      board.animate([{translate:`0 ${mirror?-40:40}%`,opacity:0,filter:'blur(2px) brightness(1.6)'},{translate:'0 0',opacity:1,filter:'none'}],{duration:IN,easing:'cubic-bezier(.2,.9,.3,1.1)'});
      [...cardEls, chrEl].filter(Boolean).forEach(el=>el.animate([{rotate:'y -90deg'},{rotate:'y 0deg'}],{duration:IN,easing:'cubic-bezier(.2,.9,.3,1.1)'}));
    }

    requestAnimationFrame(()=>board.classList.remove('nojump'));
    setTimeout(()=>{ if (gid!==gameId) return; ringAt(player.r,player.c); const [x,y]=cellCenter(player.r,player.c); burst(x,y,'#EEF7FF',14,300,4);
      const [bx,by]=centerOf(board); floatText(mirror?'거울세계':'현실', bx, by, {size:24, color:'#EEF7FF'}); }, IN*.5);
    setTimeout(()=>{ switching=false; }, IN);
    refreshHud();
  }, OUT);
}

// 10/17 거울: 좌우 벽을 지나면 좌우반전, 위아래 벽을 지나면 상하반전. 지날 때마다 현실 ↔ 거울세계

/* ================= input ================= */
function begin(){ if (!started){ started=true; tPrev=performance.now(); $('#msg').textContent=''; } }
function doStep(dr,dc,h=0){
  if (dead||busy||halted()||switching) return;
  if (zeusOn() || boomQ) return;                                     // 제우스 낙뢰·연쇄 폭파 중엔 조작 불가                                              // 제우스 낙뢰 중엔 조작 불가
  if (photoOn){ if (!(dr && dc) || kingOn()) planStep(dr,dc); refreshHud(); return; }   // 사진사: 사진 중엔 움직임을 계획만
  if (phRep && !prAuto) return;                                         // 사진 실행 중엔 입력 무시
  if (isChr('racer') && !racerAuto){ if (!(dr && dc)) racerSteer(dr,dc); refreshHud(); return; }   // 레이서: 입력은 방향만
  if (dr && dc && !kingOn()) return; // 대각선은 왕 능력 중에만
  if (tut && tut.lock) return;
  if (tut && tut.only!=null && (dr!==DIRS[tut.only][0] || dc!==DIRS[tut.only][1])){ sfx('dry'); retrigger($('#boardwrap'),'shake'); return; }
  hand = players.length>1 ? h : 0; player = players[hand];
  if (tut && tut.pz){ if (!madanOn()) pzStep(dr,dc); refreshHud(); clearHints(); return; }   // 블럭 모으기 퍼즐
  begin(); taps++;
  if (madanOn()){ madanShot(dr,dc); refreshHud(); return; } // 장전 중엔 이동이 곧 사격
  R.lastDiag = !!(dr && dc);
  const c0=clears, s0=score;
  if (step(dr,dc)){ lastDir=[dr,dc];
    if (tut && tut.holdM && findMatch()){ const H=tut.holdM; tut.holdM=null; sfx('move'); refreshHud(); clearHints();
      H(()=>{ lastClr=null; resolve(); if (tut) tutMoved(c0); postMove(clears>c0); refreshHud(); }); return; }
    if (clears===c0 && !dash && !phRep) sfx('move'); lastClr=null; resolve(); if (ndl && ndl.armed) sewerCheck(); if (tut) tutMoved(c0); else if (clears>c0) firstTips(); postMove(clears>c0); }
  refreshHud(); clearHints();
}
async function doPath(r,c){
  if (dead||busy||halted()) return;
  if (phRep) return;
  if (photoOn && ghost){
    if ((r!==ghost.r && c!==ghost.c) || (r===ghost.r && c===ghost.c)) return;
    const dr=Math.sign(r-ghost.r), dc=Math.sign(c-ghost.c);
    while (photoOn && ghost && (ghost.r!==r || ghost.c!==c) && photoPlan.length<PHOTO_MAXPLAN) planStep(dr,dc);
    refreshHud(); return;

  if ((r!==player.r && c!==player.c) || (r===player.r && c===player.c)) return;

function tick(now){
  const raw=Math.max(0,Math.min(0.1,(now-tPrev)/1000)); tPrev=now;   // 첫 프레임에 음수가 되면 elapsed가 0 아래로 내려가 포탈(벽 넘기)이 잠깐 켜짐
  if (started && !dead && !halted()){
    elapsed+=raw;
    if (!photoOn && !madanOn() && !zeusOn()) gclock+=raw*refillRate(); // 사진·마탄 장전 중엔 리필·코인 시계도 멈춤. 피버·피의 시간엔 리필이 빨라짐
    serviceRefill(); serviceCoins();
    if (vamp && elapsed>=vamp.until) endVamp();
    if (feverOn && elapsed>=feverUntil) endFever();
    if (kingUntil && elapsed>=kingUntil){ kingUntil=0; $('#pad').classList.remove('king'); }
    if (photoOn && elapsed>=photoUntil) endPhoto();
    if (phRep) replayTick(raw);
    if (madanOn() && !mt.firing && elapsed>=mt.until){ mt.firing=true; mt.shots=MADAN.shots; renderBullets(); madanDevil(); }   // 18초 안에 다 못 쏘면 7번째 탄이 바로
    tickNew(); tickNew2(); tickNew3(); tickNew4(raw);
    if (elapsed>=frozenUntil && !photoOn && !phRep && !boomQ && (!tut || tut.timeOn) && !madanOn() && !conductOn() && !runnerOn && !zeusOn()) timeLeft-=raw*(isChr('cursed')?CURSE.t:1);
    if (timeLeft<=0){ timeLeft=0; if (tut && tut.timeOn){ tut.timeOn=false; tEmit({type:'timeup'}); } else timeUp(); }
  }
  if (document.body.classList.contains('dash') && (!dash || dead || halted())){ if (dash) dashStop(); else document.body.classList.remove('dash'); }
  holdTick(now);
  if (tut && !dead && !halted()){ if (tut.pz) pzIdle(now); else if (tut.free) tutFreeIdle(now); }
  if (pSwipe && !dash && now-pSwipe.t>=PACHY.hold*1000){ const d=pSwipe.dir; pSwipe=null; if (isChr('pachy')) dashStart(d); }
  bgEffect(raw);

let bgPh=0, bgCol='', bgLv=0;
function bgEffect(dt){
  const el=document.getElementById('bgfx'); if (!el) return;
  if (!(dt>0)) dt=0; if (!(bgLv>=0)) bgLv=0;
  let best=null;
  const add=(until,color,win=3)=>{ const r=until-elapsed; if (r>0 && (!best || r<best.r)) best={r,color,win}; };
  if (curScreen==='game' && started && !dead && chr && blocks){
    const cc=chr.color;
    if (elapsed<frozenUntil) add(frozenUntil,cc);
    if (feverOn) add(feverUntil,cc);
    if (vampOn()) add(vamp.until,'#E0304A');
    if (photoOn) add(photoUntil,'#F4F4F4');
    if (cbOn()) add(cbUntil,cc);
    if (retroOn()) add(retroUntil,'#D9D9D9');
    if (chamOn()) add(chamUntil,cc);
    if (kingOn()) add(kingUntil,cc);
    if (runnerOn) add(runnerUntil,cc);
    if (madanOn() && mt.until) add(mt.until,cc);
    if (!best && zeusOn()) best={r:99,color:'#FFE14A',win:0};
    if (!best && mirror) best={r:99,color:'#BFE0FF',win:0};
    if (!best && isChr('bounty') && bountyCol>=0) best={r:bountyNext-elapsed,color:COL[bountyCol],win:2};
  }
  const col=best?best.color:'';
  if (col && col!==bgCol){ bgCol=col; el.style.background=`radial-gradient(ellipse 130% 95% at 50% 45%, ${col}59 0%, ${col}47 45%, ${col}2e 80%, ${col}1a 100%)`; }
  let target=best?1:0;
  if (best && best.r<best.win){
    if (!halted()) bgPh+=dt*(2+6*(1-best.r/best.win))*Math.PI*2;
    target=.25+.75*(.5+.5*Math.cos(bgPh)); bgLv=target;
  } else { bgPh=0; bgLv+=(target-bgLv)*Math.min(1,dt*10); }
  el.style.opacity=bgLv.toFixed(3);
}

/* ================= 소리: 합성 타악기 ================= */
let AC=null, NOISE=null;
function audioInit(){
  if (AC || !settings.sound) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    NOISE=AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d=NOISE.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(_){ AC=null; }
}
function tone(type,f0,f1,dur,vol,t){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if (f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(fType,freq,dur,vol,t){
  const n=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  n.buffer=NOISE; f.type=fType; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  n.connect(f).connect(g).connect(AC.destination); n.start(t); n.stop(t+dur+.02);
}
const DRUM = {
  kick:t=>tone('sine',150,45,.32,.9,t),
  snare:t=>{ noise('highpass',1000,.18,.55,t); tone('triangle',190,150,.1,.3,t); },
  tom:t=>tone('sine',210,120,.3,.75,t),
  wood:t=>tone('triangle',1150,900,.08,.5,t),
  hat:t=>noise('highpass',6500,.05,.3,t)
};
function sfx(name,arg){
  if (!settings.sound) return;
  audioInit(); if (!AC) return;
  if (AC.state==='suspended') AC.resume();
  const t=AC.currentTime+.005;
  switch(name){
    case 'move': noise('highpass',7000,.03,.08,t); break;
    case 'clear': DRUM[['kick','snare','tom','wood','hat'][arg]||'kick'](t); break;
    case 'recipe': tone('sine',330,220,.22,.5,t); tone('sine',440,300,.22,.45,t+.07); noise('bandpass',5200,.5,.28,t+.07); break;
    case 'ability': DRUM.kick(t); noise('bandpass',3500,.8,.4,t); break;
    case 'coin': tone('sine',1568,1568,.14,.22,t); tone('sine',2093,2093,.2,.2,t+.06); break;
    case 'end': tone('sine',180,70,.7,.7,t); break;
    case 'ui': tone('triangle',900,800,.05,.18,t); break;
    case 'shot': noise('bandpass',2400,.12,.6,t); DRUM.kick(t); tone('square',900,200,.06,.12,t); break;
    case 'dry': tone('triangle',2200,1800,.03,.2,t); break;
    case 'devil': tone('sawtooth',120,40,.8,.35,t); noise('lowpass',400,.7,.5,t); break;
    case 'needle': tone('sine',1800,2600,.12,.18,t); tone('sine',2600,3200,.1,.12,t+.06); break;
    case 'mirror': tone('sine',600,1400,.28,.25,t); noise('highpass',4000,.3,.15,t); break;
    case 'flag': tone('triangle',660,660,.1,.3,t); tone('triangle',990,990,.16,.3,t+.08); break;
    case 'flip': tone('triangle',arg?700:520,arg?1100:700,.12,.22,t); break;
    case 'legend': [523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,.35,.22,t+i*.07)); noise('highpass',6000,.6,.15,t+.2); break;
  }
}

const RANK = {N:0, R:1, SR:2, SSR:3, UR:4, H:5};
const chrSorted = () => GACHA_IDS.slice().sort((a,b)=>RANK[rarOf(a)]-RANK[rarOf(b)] || lvReq(a)-lvReq(b));
const chrList = () => ['none', ...chrSorted(), ...HIDDEN_IDS];
const veiled = id => rarOf(id)==='H' && !isUnlocked(id);   // 히든 캐릭터는 얻기 전까지 정체를 숨김
function statusOf(id){
  if (meta.chr===id && isUnlocked(id)) return ['own','장착 중'];
  if (isUnlocked(id)) return ['own','보유'];
  if (rarOf(id)==='H') return ['lv','히든 업적'];
  if (passOf(rarOf(id))>0) return ['buy','해금권'];
  if (!shopOpen(rarOf(id))) return ['lv',`상점 Lv ${SHOP_LV[rarOf(id)]}`];
  return ['gc',`◆ ${GACHA.shop[rarOf(id)]}`];
}
function renderChr(){
  $('#cCoin').textContent=meta.coins.toLocaleString();

  $('#rFil').innerHTML=[...RAR_ORDER,'H'].map(r=>{ const ids=Object.keys(RAR).filter(id=>rarOf(id)===r);
    return `<span style="--rc:var(--r${r})">${RARITY[r].name} ${ids.filter(isUnlocked).length}/${ids.length}</span>`; }).join('');
  $('#chrRow').innerHTML=chrList().map(id=>{
    const C=chrOf(id), own=isUnlocked(id), r=id==='none'?'N':rarOf(id), [sc,st]=statusOf(id);
    const eq=meta.chr===id && own;
    if (veiled(id)) return `<button class="ccard H lk" data-id="${id}" style="--rc:var(--rH)">
      <span class="rb">히든</span><span class="em">?</span><span class="nm">???</span><span class="pv">숨겨진 업적</span><span class="st lv">${st}</span></button>`;
    return `<button class="ccard ${r}${own?'':' lk'}${eq?' on':''}" data-id="${id}" style="--rc:var(--r${r})">
      <span class="rb">${id==='none'?'기본':RARITY[r].name}</span>${eq?'<span class="eq">장착</span>':''}
      <span class="em" style="background:${C.color}">${C.name[0]}</span><span class="nm">${C.name}</span>
      ${C.seq.length?`<span class="dots">${C.seq.map(c=>`<span class="dot" data-c="${c%4}"><i class="g"></i></span>`).join('')}</span>`:`<span class="pv">${id==='none'?'능력 없음':'항상 켜짐'}</span>`}

      <p>${nx?`다음 단계: ${FX_DESC[T]}`:FX_DESC[T-1]}</p>

$('#chrRow').addEventListener('click',e=>{ const b=e.target.closest('.ccard'); if (b) openChr(b.dataset.id); });
$('#cdm').addEventListener('click',e=>{
  if (e.target.id==='cdm'){ closeChr(); return; }
  const ck=e.target.closest('button[data-cheat]'); if (ck){ complete(ck.dataset.cheat); renderDet(); return; }
  const b=e.target.closest('button[data-act]'); if (!b) return;
  const a=b.dataset.act;
  if (a==='close'){ closeChr(); return; }
  if (a==='fxup'){ const T=fxOwned(selChr), nx=fxCost(selChr,T+1); if (!isUnlocked(selChr) || !nx || meta.coins<nx.coin || shardsOf(selChr)<nx.sh) return;
    meta.coins-=nx.coin; if (nx.sh) meta.cs[selChr]-=nx.sh; meta.fx=meta.fx||{}; meta.fx[selChr]=T+1; saveMeta(); sfx('legend');
    toast(`${CHARS[selChr].name} 이펙트 ${T+1}단계 · ${FX_NAME[T]}`); renderChr(); syncMeta(); return; }
  if (a==='shop'){ closeChr(); go('shop'); return; }
  if (a==='pass'){ usePass(selChr); closeChr(); syncMeta(); return; }
  if (a==='dbuy'){ buyDia(selChr); closeChr(); syncMeta(); return; }
  if (a==='trial'){ if (isUnlocked(selChr)) return; closeChr(); pendingTrial=selChr; sfx('ui'); startGame(); return; }
  if (a==='ctut'){ if (!isUnlocked(selChr) || selChr==='none') return; closeChr(); startChrTut(selChr, true); return; }
  if (a==='equip'){ meta.chr=selChr; saveMeta(); sfx('ui'); }
  if (a==='buy'){ const U=UNLOCK[selChr]; if (!canBuy(selChr) || meta.coins<U.price) return;
    meta.coins-=U.price; saveMeta(); sfx('coin'); unlock(selChr); }
  renderChr(); syncMeta();
});

// ---- 뽑기 (코인) ----
const TOP = r => r==='SSR' || r==='UR';
function rollRar(){
  const R_=curRate(); let x=Math.random()*100;
  for (const k of ['UR','SSR','SR','R']){ if (x<R_[k]) return k; x-=R_[k]; }
  return 'R';
}
let chestBusy=false;
// 10/19: 첫 뽑기는 판 수 기준 — 튜토리얼 뒤 GACHA_GAMES판을 하고, 레벨 보상 화면을 본 다음
const GACHA_GAMES=1;
const playedGames = () => (meta.stats||{}).games||0;
const lvStep = () => !!meta.ach.tut && meta.gt===1 && playedGames()>=GACHA_GAMES && !meta.seen._lvScr;   // 레벨 버튼 안내 단계
const gachaReady = () => !!meta.ach.tut && meta.gt===1 && playedGames()>=GACHA_GAMES && !!meta.seen._lvScr;   // 첫 뽑기 유도 단계
const gachaOpen = () => (meta.gt||0)>=2 || gachaReady();
function pull(){
  if (chestBusy) return;
  if (!gachaOpen()){ const t=$('#cTap'); t.textContent='튜토리얼을 끝내면 열려요'; bump(t); sfx('dry'); return; }
  const cost=pullCost();
  if (meta.coins<cost){ const t=$('#cTap'); t.textContent='코인이 부족해요'; bump(t); sfx('dry'); return; }
  if (meta.gt===1){ spotClear(); $('#g1').classList.remove('glow'); }
  meta.coins-=cost; meta.pulls=(meta.pulls||0)+1;
  let rar=rollRar(), pool=GACHA_IDS.filter(id=>rarOf(id)===rar), id=pool[rnd(pool.length)];
  // 뽑기 튜토리얼: 첫 뽑기는 족보형 희귀(정원사·시계공) 중 하나로 고정 → 바로 능력 튜토리얼
  if (meta.gt===1){ const fx=FIRST_PULL.filter(x=>!isUnlocked(x)); if (fx.length){ id=fx[rnd(fx.length)]; rar=rarOf(id); }
    meta.gt=2; meta.chr=id; meta.ctWant=id; }
  let o;
  if (!isUnlocked(id)){ meta.unlocked.push(id); o={id, rar, isNew:true}; }
  else { addPass(rar); o={id, rar, pass:true}; }   // 중복 → 같은 등급 해금권
  saveMeta(); syncMeta(); openChest([o]);
}
const FIRST_PULL=['gardener','clock'];
// 뽑기 튜토리얼: 상점에 처음 들어오면 1회분 코인을 주고 한 번 뽑게 함
function gachaTut(){
  if (!meta.gtGift){ meta.gtGift=true; meta.coins+=pullCost(); saveMeta(); syncMeta();
    const [x,y]=centerOf($('#sCoin')); floatText(`+${pullCost()}`, x, y+26, {size:26, color:'#FFD23F'}); sfx('coin'); }
  $('#g1').classList.add('glow');
  spot({mode:'act', icon:ICO.chest, text:'뽑기로 캐릭터를 뽑아 봐요'});
}
// 첫 뽑기 결과: 카드와 확인 버튼만 밝힘
function gotSpot(){
  if (meta.gt!==2 || !meta.ctWant || spotCur) return;
  $('#gOk').classList.add('glow');
  spot({mode:'act', top:true, icon:icoChr(meta.ctWant), text:`${CHARS[meta.ctWant].name} 획득!`});
}
// 처음 중복이 나왔을 때만: 해금권 설명
function dupSpot(){
  if (!lastPull.some(o=>o.pass)) return;
  spotOnce('_dup',{mode:'tap', top:true, icon:ICO.chest, holes:['#gCards'], text:'중복이면 같은 등급 해금권을 받아요. 해금권으로 원하는 캐릭터를 열 수 있어요'});
}
// 상자: 흔들리며 최고 등급 색으로 빛남 → 뚜껑이 열리며 빛줄기·파편 → 카드 공개
const RCOL={UR:'#FF5C8A', SSR:'#FFD23F', SR:'#B07CD6', R:'#5B8DEF', T:'#7C97A0'};
function openChest(out){
  chestBusy=true;
  const ch=$('#chest'), v=$('#pBox .vault');
  const best = ['UR','SSR','SR','R','T'].find(r=>out.some(o=>o.rar===r)), gc=RCOL[best];
  ch.style.setProperty('--gc',gc); v.style.setProperty('--gc',gc);
  document.body.classList.add('gfx');
  ch.classList.remove('idle','open'); ch.classList.add('charge'); ch.disabled=true;
  $('#cTap').textContent=''; sfx('flip',0);
  const hold = reduceMotion ? 0 : TOP(best) ? 1150 : best==='SR' ? 850 : best==='R' ? 600 : 450;
  setTimeout(()=>{
    ch.classList.remove('charge'); ch.classList.add('open');
    const r=ch.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height*.45;
    burst(x,y,gc,TOP(best)?70:best==='SR'?40:24,TOP(best)?620:480,7); burst(x,y,'#FFF4C2',16,380,4);
    flashScreen(gc,[x,y]); sfx(TOP(best)?'legend':'flip',1);
    setTimeout(()=>reveal(out), reduceMotion?0:700);
  }, hold);
}
function closeChest(){
  const ch=$('#chest'); ch.classList.remove('open','charge'); ch.classList.add('idle'); ch.disabled=false;
  ch.style.removeProperty('--gc'); $('#pBox .vault').style.removeProperty('--gc'); chestBusy=false;
}
const gtagOf = o => o.isNew ? '<span class="gtag new">NEW</span>' : o.pass ? `<span class="gtag dup">${RARITY[o.rar].name} 해금권</span>` : '';
let revealT=[];
let lastPull=[];
function reveal(out){
  revealT.forEach(clearTimeout); revealT=[]; lastPull=out;
  const box=$('#gCards'), ok=$('#gOk');
  box.className='gcards'+(out.length===1?' one':''); ok.classList.remove('on');
  box.innerHTML=out.map((o,i)=>{ const C=CHARS[o.id];
    return `<div class="gc ${o.rar} enter" style="--rc:var(--r${o.rar});animation-delay:${i*40}ms" data-i="${i}"><div class="in">
      <div class="bk"></div>
      <div class="fr"><span class="em" style="background:${C.color}">${C.name[0]}</span><span class="nm">${C.name}</span><span class="rr">${RARITY[o.rar].name}</span>
      ${gtagOf(o)}</div></div></div>`; }).join('');
  document.body.classList.add('gfx'); $('#gres').classList.add('on');
  const cards=[...box.children], base=out.length*40+360;
  // 뒤집기 전 테두리 색으로 등급을 살짝 예고 → 차례로 뒤집기
  cards.forEach((el,i)=>revealT.push(setTimeout(()=>el.classList.add('peek'), base-160+i*30)));
  cards.forEach((el,i)=>revealT.push(setTimeout(()=>flipCard(el,out[i]), base+i*(out.length>1?230:0)+ (out.length>1?0:200))));
  revealT.push(setTimeout(()=>{ ok.classList.add('on'); gotSpot(); dupSpot(); }, base+out.length*230+200));
}
function flipCard(el,o){
  if (el.classList.contains('flip')) return;
  el.classList.add('flip');
  const [x,y]=centerOf(el);
  if (TOP(o.rar)){ const gc=RCOL[o.rar]; flashScreen(gc,[x,y]); burst(x,y,gc,40,520,7); burst(x,y,'#FFF4C2',16,360,4); sfx('legend');
    if (!reduceMotion) el.animate([{scale:1.18},{scale:1}],{duration:420,easing:'cubic-bezier(.2,.9,.3,1.4)'}); }
  else if (o.rar==='SR'){ burst(x,y,'#B07CD6',22,380,6); sfx('flip',1); }
  else if (o.rar==='R'){ burst(x,y,'#5B8DEF',8,240,4); sfx('flip',0); }
  else sfx('dry');
}
$('#gres').addEventListener('click',e=>{
  if (e.target.closest('#gOk')){ revealT.forEach(clearTimeout); revealT=[]; $('#gres').classList.remove('on'); document.body.classList.remove('gfx'); closeChest(); renderShop();
    $('#gOk').classList.remove('glow'); spotClear();
    if (meta.gt===2 && meta.ctWant) $('#sShop .back').classList.add('glow');
    return; }
  // 탭하면 남은 카드 한 번에 공개
  const out=[...$('#gCards').children];
  if (out.some(el=>!el.classList.contains('flip'))){
    revealT.forEach(clearTimeout); revealT=[];
    const data=lastPull; out.forEach((el,i)=>{ el.classList.add('peek'); flipCard(el,data[i]); });
    $('#gOk').classList.add('on'); gotSpot(); dupSpot();
  }
});
const today = () => new Date().toISOString().slice(0,10);
function weekKey(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }

$('#gAd').addEventListener('click',()=>{ if (meta.adN>=ECON.adMax) return; meta.adN++; meta.dia+=ECON.ad; saveMeta(); sfx('coin'); toast(`광고 보상 ◆ ${ECON.ad}`); syncMeta(); });

// ---- 메뉴 ----
// 처음 들어왔을 때는 진행 순서대로만 열림: 규칙 튜토리얼 전엔 게임 시작만, 첫 판 뒤엔 상점(뽑기)만, 첫 캐릭터 튜토리얼 판을 시작하면 전부
// 단계: 0 게임 시작만 → 'lv' 레벨 버튼 → 1 상점 → 2 게임 시작(능력 튜토리얼) → 3 전부. 레벨 버튼은 한 번 열리면 계속 열림
// 10/19 단계(한 번 열린 메뉴는 다시 잠기지 않음, 설정은 처음부터 열림):
//  start 게임 시작 → lv 레벨 버튼 → shop 상점(뽑기) → chr 캐릭터 메뉴 → play 게임 시작(능력 튜토리얼) → ach 업적(한 판 더 하고 오면) → all
const menuStage = () => {
  if (!meta.ach.tut) return 'start';
  const gt=meta.gt||0;
  if (gt<=1) return lvStep() ? 'lv' : gachaReady() ? 'shop' : 'start';
  if (gt===2) return meta.seen._chr ? 'play' : 'chr';
  if (!meta.seen._ach) return 'ach';
  return meta.seen._pz ? 'all' : 'pz';   // 11/6: 업적 안내 다음에 퍼즐 안내
};
const MENU_OPEN = {start:[], lv:['lv'], shop:['lv','shop'], chr:['lv','shop','chr'], play:['lv','shop','chr'], ach:['lv','shop','chr','ach'], pz:['lv','shop','chr','ach','pz'], all:['lv','shop','chr','ach','pz']};
const menuKey = el => el.id==='mLv' ? 'lv' : el.id==='mChr' ? 'chr' : el.dataset.go;
function syncLocks(){
  const open=MENU_OPEN[menuStage()];
  document.querySelectorAll('#sMenu .mnav button, #mLv, #mChr').forEach(el=>{ const k=menuKey(el);
    el.classList.toggle('lockd', k!=='set' && !open.includes(k)); });
}
// 메뉴는 가리지 않음. 잠긴 버튼은 비활성, 지금 누를 버튼만 은은하게 빛남
function menuSpot(){
  const st=menuStage(), nav=k=>$(`#sMenu .mnav [data-go=${k}]`);
  $('#mStart').classList.toggle('glow', st==='start' || st==='play');
  $('#mLv').classList.toggle('glow', st==='lv');
  for (const k of ['shop','chr','ach','pz']) nav(k).classList.toggle('glow', st===k);
}
function syncMeta(){
  gCheck(); syncLocks();
  $('#mCoin').textContent=meta.coins.toLocaleString(); $('#mDia').textContent=meta.dia.toLocaleString();
  $('#mSub').textContent = !meta.ach.tut ? '' : gachaReady() ? '첫 캐릭터 뽑기' : meta.lv<MAIN ? `Lv ${meta.lv+1}에 ${STAGES[meta.lv].what}`
    : meta.best ? `최고점 ${meta.best.toLocaleString()}` : '';
  $('#mLv').innerHTML=`Lv ${meta.lv}<span class="xb"><i style="width:${Math.min(100,meta.xp/needXp(meta.lv)*100)}%"></i></span>`;
  const C=chrOf(isUnlocked(meta.chr)?meta.chr:'none');
  $('#mChr').innerHTML=`<span class="emb" style="background:${C.color}">${C.name[0]}</span>${C.name}`;
  $('#bAch').classList.toggle('on', !!meta.newAch);
  $('#bChr').classList.toggle('on', RAR_ORDER.some(r=>passOf(r)>0 && lackOf(r).length));
  $('#bGacha').classList.toggle('on', (gachaOpen() && meta.coins>=pullCost()) || RAR_ORDER.some(r=>passOf(r)>0 && lackOf(r).length) || RAR_ORDER.some(r=>passOf(r)>=GACHA.synth && NEXT_R[r]));
  if (curScreen==='chr') renderChr();
  if (curScreen==='ach') renderAch();
  if (curScreen==='shop') renderShop();
  $('#pCoin').textContent=meta.coins.toLocaleString();
}

// ---- 설정 ----
function seg(id,key,cb){
  const el=$(id), val=x=>isNaN(+x.dataset.v)?x.dataset.v:+x.dataset.v;
  el.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    cfg[key]=val(b); [...el.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
    cb && cb(cfg[key]);
  });
  [...el.children].forEach(x=>x.setAttribute('aria-pressed',val(x)===cfg[key]));
}
function toggle(id,get,set){ const b=$(id); const sync=()=>b.setAttribute('aria-pressed',!!get()); b.addEventListener('click',()=>{ set(!get()); sync(); }); sync(); }
function syncInput(){
  $('#pad').classList.toggle('on',cfg.input==='dpad');
  if (cfg.input!=='dpad') padStop();
  layout(); if (blocks) showHints();
}
seg('#segI','input',v=>{ settings.input=v; saveSettings(); syncInput(); });
toggle('#tgSound',()=>settings.sound,v=>{ settings.sound=v; saveSettings(); if (v) sfx('ui'); });
toggle('#tgReduce',()=>settings.reduce,v=>{ settings.reduce=v; saveSettings(); reduceMotion=v||matchMedia('(prefers-reduced-motion: reduce)').matches; document.body.classList.toggle('reduce',reduceMotion); });
document.body.classList.toggle('reduce',reduceMotion);
toggle('#tgCheat',()=>achCheat,v=>{ achCheat=v; });
let resetArm=0;
$('#resetMeta').addEventListener('click',e=>{
  const b=e.currentTarget;
  if (Date.now()-resetArm>3000){ resetArm=Date.now(); b.textContent='한 번 더 누르면 초기화'; setTimeout(()=>{ b.textContent='진행 초기화'; },3000); return; }
  resetArm=0; b.textContent='진행 초기화';
  meta=metaBase(); saveMeta(); wantTut=null; go('menu');
});
$('#cheat').addEventListener('click',()=>{ meta.coins+=500; saveMeta(); syncMeta(); toast('코인 +500'); });
$('#cheatD').addEventListener('click',()=>{ meta.dia+=300; saveMeta(); syncMeta(); toast('다이아 +300'); });
$('#cheatP').addEventListener('click',()=>{ RAR_ORDER.forEach(addPass); saveMeta(); syncMeta(); toast('해금권 등급별 +1'); });
$('#cheatMax').addEventListener('click',()=>{
  meta.lv=Math.max(meta.lv, 30); meta.xp=0; meta.bupSeen=MAIN; meta.ach.tut=true; meta.gt=3; meta.seen._ach=meta.seen._ach2=meta.seen._pz=true;
  meta.fx=meta.fx||{};
  for (const id of Object.keys(RAR)){ if (!meta.unlocked.includes(id)) meta.unlocked.push(id); }
  saveMeta(); syncMeta(); $('#dStage').textContent=meta.lv; toast(`전부 해금 · Lv ${meta.lv}`); });
$('#cheatAll').addEventListener('click',()=>{ for (const id of Object.keys(RAR)) if (!meta.unlocked.includes(id)) meta.unlocked.push(id); saveMeta(); syncMeta(); toast('캐릭터 전부 해금'); });
const stageMove=d=>{ meta.lv=Math.max(1,meta.lv+d); meta.xp=0; meta.bupSeen=Math.min(meta.lv,MAIN); saveMeta(); $('#dStage').textContent=meta.lv; syncMeta(); };
$('#stUp').addEventListener('click',()=>stageMove(1));
$('#stDown').addEventListener('click',()=>stageMove(-1));
$('#tutAgain').addEventListener('click',()=>{ wantTut=true; startGame(); });
// 디버그: 튜토리얼 단계로 바로 이동 (코인·캐릭터 등 다른 진행은 그대로)
function dbgTut(k){
  for (const x of ['_coin','_multi','_lv','_lvScr','_ach','_ach2','_pz','_chr']) delete meta.seen[x];
  meta.stats=meta.stats||{}; meta.gtGift=false; meta.ctWant=null; wantTut=null;
  if (k===0){ delete meta.ach.tut; meta.gt=0; meta.stats.games=0; }
  else { meta.ach.tut=true; meta.stats.games = k===1 ? 0 : Math.max(GACHA_GAMES, meta.stats.games||0); meta.gt=1;
    if (k>=2){ meta.seen._lv=true; meta.seen._lvScr=true; }
    if (k===3){ const id='gardener'; if (!isUnlocked(id)) meta.unlocked.push(id); meta.chr=id; meta.ctWant=id; meta.gt=2; meta.seen._coin=meta.seen._multi=meta.seen._chr=true; } }
  saveMeta(); syncMeta(); toast('튜토리얼 단계로 이동'); go('menu');
}
document.querySelectorAll('[data-dtut]').forEach(b=>b.addEventListener('click',()=>{ sfx('ui'); const v=b.dataset.dtut;
  dbgTut(+v); }));
// 디버그 화면은 메뉴 로고를 5번 눌러도 열림 (튜토리얼 중 메뉴가 잠겨 있을 때용)
{ let n=0, t=0; $('#sMenu .logo').addEventListener('click',()=>{ const now=performance.now(); n = now-t<600 ? n+1 : 1; t=now; if (n>=5){ n=0; go('dbg'); } }); }

// ---- 이동 ----
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if (b){ sfx('ui'); go(b.dataset.go); } });
$('#sIntro').addEventListener('click',()=>{ audioInit(); sfx('ui'); go('menu'); });
$('#mStart').addEventListener('click',()=>{ sfx('ui'); if (gachaReady()) go('shop'); else startGame(); });
$('#ovGacha').addEventListener('click',()=>{ sfx('ui'); go('shop'); });
$('#pauseBtn').addEventListener('click',()=>setPause(true));
$('#pResume').addEventListener('click',()=>setPause(false));
$('#pRestart').addEventListener('click',()=>{ if (runTrial){ go('chr'); return; } startGame(); });
$('#pMenu').addEventListener('click',leaveGame);
$('#pEnd').addEventListener('click',()=>{ $('#pause').classList.remove('on'); paused=false; if (tut){ tutSkip(); return; } started=true; timeLeft=0.01; tPrev=performance.now(); });
$('#again').addEventListener('click',()=>{ sfx('ui'); startGame(); });
$('#toMenu').addEventListener('click',()=>{ sfx('ui'); go('menu'); });
addEventListener('keydown',e=>{ if (typing(e)) return; if (e.key==='Escape' && curScreen==='game') setPause(!paused); });
addEventListener('keyup',e=>{ if (/^Arrow|^[wasd]$/.test(e.key)){ pKey=false; if (dash) dash.held=false; } });
board=$('#board');
function fitViewport(){
  const h = window.visualViewport ? visualViewport.height : innerHeight;
  document.documentElement.style.setProperty('--appH', Math.round(h)+'px');
  if (scrollY) scrollTo(0,0);
}
fitViewport();
if (window.visualViewport) visualViewport.addEventListener('resize',()=>{ fitViewport(); layout(); });
addEventListener('resize',()=>{ fitViewport(); layout(); });
addEventListener('orientationchange',()=>setTimeout(()=>{ fitViewport(); layout(); },250));
document.addEventListener('touchmove',e=>{ if (e.target.closest && e.target.closest('.scr, #card, #coach .cc, #cdm .cdc')) return; e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

document.body.classList.add('inscr');
syncMeta();
bindBoard(); bindPad();
syncInput();
requestAnimationFrame(()=>layout());
if (window.ResizeObserver){
  let roRaf=0;
  new ResizeObserver(()=>{ cancelAnimationFrame(roRaf); roRaf=requestAnimationFrame(layout); }).observe($('#boardwrap'));
}
requestAnimationFrame(tick);
</script>

</body></html>
