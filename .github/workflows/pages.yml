# main 브랜치에 push하면 Godot 웹 빌드(export_presets.cfg의 "Web")를 만들어 GitHub Pages에 올린다.
# - 웹 빌드는 단일 스레드(variant/thread_support=false)라 GitHub Pages처럼 COOP/COEP 헤더를 못 붙이는 곳에서도 돈다.
# - 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 바꾼다.
# - 올라간 주소는 Actions 실행 결과의 deploy 단계와 Settings → Pages에 나온다 (https://<owner>.github.io/<repo>/).
# - Actions 탭에서 "Run workflow"로 수동 배포도 된다.

name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
  TEMPLATES_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o godot.zip "$GODOT_URL"
          unzip -q godot.zip -d ~/godot
          curl -fsSL -o templates.tpz "$TEMPLATES_URL"
          # 웹 템플릿만 꺼낸다 (전체 묶음은 1GB 넘음)
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -qj templates.tpz 'templates/web_*' 'templates/version.txt' -d "$T"
          rm godot.zip templates.tpz

      - name: Locate Godot
        run: echo "GODOT_BIN=$(ls ~/godot/Godot_v*_linux.x86_64)" >> "$GITHUB_ENV"

      - name: Stamp build name
        # 설정 화면의 디버그 버튼에 보인다 (기기에 옛 판이 남아 있는지 확인용)
        run: |
          STAMP="$(TZ=Asia/Seoul date +%m%d-%H%M) ${GITHUB_SHA::7}"
          sed -i "s|^config/name=|config/version=\"$STAMP\"\nconfig/name=|" project.godot
          grep '^config/version=' project.godot

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path . --import || true

      - name: Export web build
        run: |
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck && test -f build/web/index.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
