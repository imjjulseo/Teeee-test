# 초안: 저장소에 push / PR이 오면 Linux 헤드리스 Godot으로 단위 테스트를 실행한다.
# - 실제 창이 필요한 스모크 테스트(tests/smoke)는 여기서 돌리지 않는다 (로컬에서 run_smoke.ps1).
# - 아직 실행해 본 적 없는 초안이다. 처음 올린 뒤 Actions 탭에서 결과를 확인하고,
#   GODOT_URL이 실제 릴리스 파일 이름과 다르면 맞게 고친다.

name: unit-tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "$GODOT_URL"
          unzip -q godot.zip -d godot
          echo "GODOT_BIN=$(ls "$PWD"/godot/Godot_v*_linux.x86_64)" >> "$GITHUB_ENV"

      - name: Import project (class cache)
        run: |
          "$GODOT_BIN" --headless --path . --import || true

      - name: Run unit tests
        run: |
          "$GODOT_BIN" --headless --path . -s tests/run_tests.gd

      - name: Project loads without script errors
        run: |
          "$GODOT_BIN" --headless --path . --quit
